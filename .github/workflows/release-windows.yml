name: Build & Release Windows (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Instalador Nativo Kova PDF Windows (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Configurar Rust estable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Caché de compilación Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias Frontend
        run: npm ci

      - name: Compilar Ejecutable e Instalador Windows (Tauri v2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kova PDF ${{ github.ref_name }}'
          releaseBody: |
            ## Kova PDF ${{ github.ref_name }} — Windows 10 & Windows 11 (x64)
            Descarga el instalador oficial `.exe` (NSIS) o `.msi` abajo e instálalo en segundos.
            - **100% Local & Privado:** Tus documentos jamás salen de tu equipo.
            - **Edición Tipográfica de Alta Precisión:** Detección inteligente de colores de texto y fondos oscuros/claros, cero superposición de glifos y corrección sin subrayados ortográficos.
            - **Suite Completa:** Editar PDF, Firmar, Eliminar páginas, Unir, Dividir (ZIP), Comprimir, Recortar márgenes, PDF a Word (.docx), PDF a Excel (.csv), PDF ↔ Imágenes, OCR local, Numeración Bates y Limpiador de Metadatos.
            - **Ventana Adaptativa High-DPI:** Maximizado automático y paneles adaptativos para laptops Windows 11 (125%–150% DPI) y monitores 4K.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Compilar Instalador .exe (Push / Verificación Manual)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Subir Instalador .exe y .msi como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Kova-PDF-Windows-Installer-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/KovaPDF.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/kova-pdf.exe
          if-no-files-found: warn
