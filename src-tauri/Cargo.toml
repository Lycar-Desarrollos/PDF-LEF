[package]
name = "pdf-lef"
version = "1.0.0"
description = "PDF-LEF Studio Pro — Suite PDF Nativa 100% Local para Windows"
authors = ["Lycar Desarrollos"]
license = "MIT"
repository = "https://github.com/Lycar-Desarrollos/PDF-LEF"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdf_lef_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
