[package]
name = "kova-pdf"
version = "2.2.0"
description = "Kova PDF — Estudio PDF Nativo 100% Local para Windows"
authors = ["Kova Studio"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kova_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
